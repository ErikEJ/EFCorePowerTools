name: Formatting

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    # Both solutions contain projects that need Visual Studio (VSSDK/SSDT).
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'

      # The helper restores with Visual Studio MSBuild when available.
      - name: Verify formatting
        run: dotnet run --file .github/scripts/verify-format.cs
